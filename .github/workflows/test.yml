name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Newman
        run: npm install -g newman
        
      - name: Run Postman tests
        run: |
          newman run postman/dog-adoption-api.postman_collection.json \
            -e postman/production.postman_environment.json
            