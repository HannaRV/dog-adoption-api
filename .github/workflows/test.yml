# Deployment is manual via workflow_dispatch to maintain control over
# when production is updated. Tests run automatically on every push.

name: API Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Newman
        run: npm install -g newman
        
      - name: Run Postman tests
        run: |
          newman run postman/dog-adoption-api.postman_collection.json \
            -e postman/production.postman_environment.json

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: production
      url: https://dog-adoption-api.duckdns.org
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 46.101.116.33 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: ssh root@46.101.116.33 "echo 'SSH Connection Test'"

      - name: Deploy to Production
        run: |
          ssh root@46.101.116.33 "cd dog-adoption-api && \
            git pull && \
            docker build -t dog-adoption-api . && \
            docker stop dog-adoption-api && \
            docker rm dog-adoption-api && \
            docker run -d \
              --name dog-adoption-api \
              --env-file .env \
              -p 3000:3000 \
              --restart unless-stopped \
              dog-adoption-api"